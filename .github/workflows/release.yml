name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default; only the publish step's job gets write access.
permissions:
  contents: read

jobs:
  package:
    name: Build and publish DMG
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select and show Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # Developer ID signing is opt-in. Without these repository secrets the build
      # stays ad-hoc signed, exactly as before:
      #   MACOS_DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" .p12
      #   MACOS_DEVELOPER_ID_P12_PASSWORD password used when exporting the .p12
      #   APPLE_TEAM_ID                   10-character Team ID
      #   NOTARY_API_KEY_P8_BASE64        base64 of an App Store Connect API key (.p8)
      #   NOTARY_API_KEY_ID               that key's ID
      #   NOTARY_API_ISSUER_ID            the issuer ID shown with the key
      - name: Import Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" ]]; then
            echo "No Developer ID secrets; building ad-hoc."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          if [[ -n "$NOTARY_KEY_BASE64" ]]; then
            printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Build and verify release package
        env:
          PACKAGE_ARCHS: arm64 x86_64
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/notary-key.p8" ]]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
            export REQUIRE_NOTARIZATION=1
          fi
          Scripts/package-release.sh

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8"
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi

      - name: Prepare stable DMG asset
        run: |
          set -euo pipefail
          dmg_path="$(find "$GITHUB_WORKSPACE/build/Distribution" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cp "$dmg_path" "$GITHUB_WORKSPACE/ClipboardManager.dmg"
          shasum -a 256 "$GITHUB_WORKSPACE/ClipboardManager.dmg" > "$GITHUB_WORKSPACE/ClipboardManager.dmg.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipboardManager-macos
          path: |
            ClipboardManager.dmg
            ClipboardManager.dmg.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A DMG already attached to the release (for example a locally built,
            # team-signed one) is authoritative; never replace it with this build.
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -qx 'ClipboardManager.dmg'; then
              echo "Release already has ClipboardManager.dmg; keeping it. This build is in the workflow artifact."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" \
              ClipboardManager.dmg \
              ClipboardManager.dmg.sha256 \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              ClipboardManager.dmg \
              ClipboardManager.dmg.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Clipboard Manager $GITHUB_REF_NAME" \
              --generate-notes
          fi
