name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build and publish DMG
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select and show Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Build and verify release package
        env:
          PACKAGE_ARCHS: arm64 x86_64
        run: Scripts/package-release.sh

      - name: Prepare stable DMG asset
        run: |
          set -euo pipefail
          dmg_path="$(find "$GITHUB_WORKSPACE/build/Distribution" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cp "$dmg_path" "$GITHUB_WORKSPACE/ClipboardManager.dmg"
          shasum -a 256 "$GITHUB_WORKSPACE/ClipboardManager.dmg" > "$GITHUB_WORKSPACE/ClipboardManager.dmg.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-macos
          path: |
            ClipboardManager.dmg
            ClipboardManager.dmg.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              ClipboardManager.dmg \
              ClipboardManager.dmg.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              ClipboardManager.dmg \
              ClipboardManager.dmg.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Clipboard Manager $GITHUB_REF_NAME" \
              --generate-notes
          fi
